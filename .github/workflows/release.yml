name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The legacy update E2E needs the previous release tag's sources.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-release.txt

      - name: Install pinned release environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Virtual environment creation failed" }
          .\.venv\Scripts\python.exe -m pip install --upgrade "pip==26.2.1"
          if ($LASTEXITCODE -ne 0) { throw "Pinned pip installation failed" }
          $ConstraintPath = (Resolve-Path -LiteralPath "constraints-release.txt").Path
          $env:PIP_CONSTRAINT = ([System.Uri]$ConstraintPath).AbsoluteUri
          .\.venv\Scripts\python.exe -m pip install -c constraints-release.txt -e ".[dev,build]"
          if ($LASTEXITCODE -ne 0) { throw "Pinned release environment installation failed" }
          .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Release environment dependency check failed" }

      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          if ("v$Version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package version v$Version"
          }

      - name: Build, test and smoke-test package
        shell: pwsh
        run: .\scripts\build.ps1 -OutputRoot dist

      - name: Build per-user installer
        shell: pwsh
        run: |
          .\scripts\setup_installer.ps1
          .\scripts\build_installer.ps1 -OutputRoot dist

      - name: Installer lifecycle gate
        shell: pwsh
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          .\.venv\Scripts\python.exe scripts\run_installer_e2e.py --disposable-account --installer "dist\releases\SortInator-$Version-Setup.exe" --zip "dist\releases\SortInator-$Version-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw "Installer lifecycle validation failed" }

      - name: Legacy update end-to-end gate (candidate bytes)
        shell: pwsh
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          .\scripts\run_update_release_e2e.ps1 -CandidateZip "dist\releases\SortInator-$Version-windows-x64.zip" -CandidateVersion $Version
          .\scripts\run_update_release_e2e.ps1 -CandidateZip "dist\releases\SortInator-$Version-windows-x64.zip" -CandidateVersion $Version -LegacyTag "v0.17.1" -LegacyZipName "Organizador-0.17.1-windows-x64.zip"
        # Runs against the exact candidate bytes before anything is published,
        # so a legacy-updater incompatibility never reaches the public release.
        # Both baselines run: v0.6.1 proves the oldest updater, v0.17.1 the
        # closest pre-rename client (which also carries the profile dir).

      - name: Publish prerelease assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          $Archive = "dist\releases\SortInator-$Version-windows-x64.zip"
          $Checksum = "$Archive.sha256"
          $Installer = "dist\releases\SortInator-$Version-Setup.exe"
          # Pre-rename clients only discover Organizador-<ver>-windows-x64.zip:
          # publish a byte-identical alias so 0.17.x can begin the update.
          $ArchiveHash = ((Get-Content -LiteralPath $Checksum -Raw).Trim() -split '\s+')[0]
          $LegacyArchive = "dist\releases\Organizador-$Version-windows-x64.zip"
          $LegacyChecksum = "$LegacyArchive.sha256"
          Copy-Item -LiteralPath $Archive -Destination $LegacyArchive -Force
          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($LegacyChecksum, "$ArchiveHash  Organizador-$Version-windows-x64.zip`n", $Utf8NoBom)
          gh release view "v$Version" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v$Version already exists; published assets are immutable"
          }
          gh release create "v$Version" $Archive $Checksum $Installer "$Installer.sha256" $LegacyArchive $LegacyChecksum --verify-tag --generate-notes --title "SortInator v$Version" --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease publication failed" }

      - name: Download the exact public prerelease assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          New-Item -ItemType Directory -Path e2e-public -Force | Out-Null
          gh release download "v$Version" --dir e2e-public --pattern "SortInator-$Version-*"
          if ($LASTEXITCODE -ne 0) { throw "Public prerelease download failed" }
          $LocalHash = ((Get-Content -LiteralPath "dist\releases\SortInator-$Version-windows-x64.zip.sha256" -Raw).Trim() -split '\s+')[0]
          $PublicHash = ((Get-Content -LiteralPath "e2e-public\SortInator-$Version-windows-x64.zip.sha256" -Raw).Trim() -split '\s+')[0]
          if ($LocalHash -ne $PublicHash) { throw "Public prerelease bytes differ from the tested candidate" }
          $ActualHash = (Get-FileHash -LiteralPath "e2e-public\SortInator-$Version-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualHash -ne $PublicHash.ToLowerInvariant()) { throw "Public prerelease checksum mismatch" }
          $SetupName = "SortInator-$Version-Setup.exe"
          $LocalSetupHash = (Get-FileHash -LiteralPath "dist\releases\$SetupName" -Algorithm SHA256).Hash
          $PublicSetupHash = (Get-FileHash -LiteralPath "e2e-public\$SetupName" -Algorithm SHA256).Hash
          $SetupSidecar = ((Get-Content -LiteralPath "e2e-public\$SetupName.sha256" -Raw).Trim() -split '\s+')[0]
          if ($LocalSetupHash -ne $PublicSetupHash -or $PublicSetupHash -ne $SetupSidecar) { throw "Public installer checksum mismatch" }
          gh release download "v$Version" --dir e2e-public --pattern "Organizador-$Version-*"
          if ($LASTEXITCODE -ne 0) { throw "Public legacy alias download failed" }
          $PublicLegacyZip = "e2e-public\Organizador-$Version-windows-x64.zip"
          $PublicLegacyHash = (Get-FileHash -LiteralPath $PublicLegacyZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $PublicLegacySidecar = ((Get-Content -LiteralPath "$PublicLegacyZip.sha256" -Raw).Trim() -split '\s+')[0]
          if ($PublicLegacyHash -ne $ActualHash) { throw "Public legacy alias bytes differ" }
          if ($PublicLegacySidecar.ToLowerInvariant() -ne $PublicHash) { throw "Public legacy alias checksum mismatch" }

      - name: Legacy update end-to-end gate (public bytes)
        shell: pwsh
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          .\scripts\run_update_release_e2e.ps1 -CandidateZip "e2e-public\SortInator-$Version-windows-x64.zip" -CandidateVersion $Version
          .\scripts\run_update_release_e2e.ps1 -CandidateZip "e2e-public\SortInator-$Version-windows-x64.zip" -CandidateVersion $Version -LegacyTag "v0.17.1" -LegacyZipName "Organizador-0.17.1-windows-x64.zip"
        # Re-verifies the bytes a user actually downloads; the candidate bytes
        # were already validated before publication.
        # On failure the prerelease stays unpublished to /releases/latest (manual
        # bridge policy): old installations are never offered an unsafe update.

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-e2e-evidence
          path: |
            update-e2e-evidence-*.log
            e2e-public/

      # Manual bridge policy (v0.6.2): the exact v0.6.1 updater was proven to
      # silently no-op on non-ASCII install paths (its .cmd helper misreads
      # UTF-8 paths), so v0.6.2 stays a prerelease and is NEVER auto-promoted:
      # /releases/latest keeps returning v0.6.1 and no installed app is offered
      # an update it cannot apply. Promote manually only once the installed
      # base runs an updater that is proven Unicode-safe end to end.
