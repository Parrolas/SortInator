[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-estudo"
dynamic = ["version"]
description = "SortInator: organização local de ficheiros de estudo para Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "José Parrolas" }]
dependencies = [
    # openpyxl uses defusedxml dynamically to harden parsing of untrusted workbooks.
    "defusedxml>=0.7,<1",
    "openpyxl>=3.1,<4",
    "PySide6-Essentials>=6.8,<7",
    "pypdf>=6,<7",
    "pypdfium2>=5,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "rapidfuzz>=3.10,<4",
    "watchdog>=6,<7",
    "pywin32>=312,<313",
    "winrt-Windows.UI.Notifications>=3,<4",
    "winrt-Windows.Data.Xml.Dom>=3,<4",
    "winrt-runtime>=3,<4",
    "winrt-Windows.Foundation>=3,<4",
    "winrt-Windows.Foundation.Collections>=3,<4",
    "winrt-Windows.Globalization>=3,<4",
    "winrt-Windows.Graphics.Imaging>=3,<4",
    "winrt-Windows.Media.Ocr>=3,<4",
    "winrt-Windows.Storage.Streams>=3,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pillow>=10,<13",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "types-openpyxl>=3.1,<4",
]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
organizador = "organizador.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "organizador.__version__" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["organizador"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["organizador"]

[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pythoncom", "pywintypes", "win32com.*"]
ignore_missing_imports = true
